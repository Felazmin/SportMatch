name: test_do_an
description: "NVH sports booking application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  flutter_secure_storage: ^10.3.4
  diacritic: ^0.1.6
  url_launcher: 6.3.3
  qr_flutter: 4.1.0
  image_picker: 1.2.4
  file_selector: 1.1.0
  pdfrx: 2.6.5
  record: 7.1.1
  audioplayers: 6.8.1
  path_provider: 2.1.6
  flutter_map: 8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: 5.0.0
  http: 1.6.0
  pdf: ^3.13.1
  share_plus: ^13.3.1
  sqflite: 2.4.4+2
  path: ^1.9.1
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1
  sqflite_common_ffi: ^2.4.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/illustrations/venues/
    - assets/figma/
    - assets/auth/
    - assets/account/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
