<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1172" viewBox="0 0 1160 1172"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527367"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M100.0,167 L100.0,1018" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M420.0,167 L420.0,1018" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M740.0,167 L740.0,1018" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M1060.0,167 L1060.0,1018" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M100.0,235 L420.0,235" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M420.0,292 L740.0,292" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,349 L420.0,349" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M420.0,406 L740.0,406" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,463 L420.0,463" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M100.0,520 L420.0,520" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M420.0,577 L740.0,577" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,634 L1060.0,634" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1060.0,691 L740.0,691" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M740.0,748 L420.0,748" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M100.0,805 L420.0,805" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M420.0,862 L740.0,862" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,919 L1060.0,919" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,976 L420.0,976" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M20,1018 L1140,1018" fill="none" stroke="#527367" stroke-width="1.5"/><text x="39" y="33.0" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#172b25">Đặt sân và xác nhận thanh toán</text><text x="39" y="79.0" font-family="Arial" font-size="14" font-weight="normal" text-anchor="start" fill="#172b25">Hiện trạng: gọi nội bộ Flutter, không có API server. Mũi tên đứt: trả kết quả hoặc lỗi.</text><rect x="15.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="100.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">Khách / Chủ sân</text><rect x="335.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="420.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">UI Flutter</text><rect x="655.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="740.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">DemoSession</text><rect x="975.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="1060.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">SessionStore</text><rect x="20" y="175" width="1120" height="977" fill="none" stroke="#60756d"/><text x="31" y="194.0" font-family="Arial" font-size="12" font-weight="normal" text-anchor="start" fill="#172b25">alt [kiểm tra hợp lệ]</text><rect x="110.0" y="195" width="300.0" height="38" fill="white"/><text x="260.0" y="218.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">1. Chọn giờ và xác nhận thông tin</text><rect x="430.0" y="252" width="300.0" height="38" fill="white"/><text x="580.0" y="275.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">2. reserve: quyền, lịch trùng, giá và policy</text><rect x="430.0" y="309" width="300.0" height="38" fill="white"/><text x="580.0" y="332.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">3. DemoBooking hoặc lỗi; snapshot hợp đồng</text><rect x="430.0" y="366" width="300.0" height="38" fill="white"/><text x="580.0" y="389.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">4. startTransfer(checkout: true)</text><rect x="430.0" y="423" width="300.0" height="38" fill="white"/><text x="580.0" y="437.84" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">5. Deadline tối đa 15 phút, thông tin chuyển</text><text x="580.0" y="455.0" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">khoản</text><rect x="110.0" y="480" width="300.0" height="38" fill="white"/><text x="260.0" y="503.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">6. Chọn ảnh thanh toán và thẻ sinh viên mẫu</text><rect x="430.0" y="537" width="300.0" height="38" fill="white"/><text x="580.0" y="551.84" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">7. saveProofDraft / saveStudentDraft;</text><text x="580.0" y="569.0" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">submitProof</text><rect x="750.0" y="594" width="300.0" height="38" fill="white"/><text x="900.0" y="617.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">8. Xếp hàng lưu snapshot JSON</text><rect x="750.0" y="651" width="300.0" height="38" fill="white"/><text x="900.0" y="674.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">9. Lưu thành công hoặc saveFailed</text><rect x="430.0" y="708" width="300.0" height="38" fill="white"/><text x="580.0" y="731.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">10. notifyListeners: pending, chưa xác nhận</text><rect x="110.0" y="765" width="300.0" height="38" fill="white"/><text x="260.0" y="788.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">11. Đăng nhập chủ sân, xem và quyết định</text><rect x="430.0" y="822" width="300.0" height="38" fill="white"/><text x="580.0" y="845.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">12. reviewPayment(approve / note)</text><rect x="750.0" y="879" width="300.0" height="38" fill="white"/><text x="900.0" y="902.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">13. Lưu trạng thái và ngày ghi nhận</text><rect x="430.0" y="936" width="300.0" height="38" fill="white"/><text x="580.0" y="959.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">14. approved hoặc rejected có lý do</text><text x="570.0" y="1038.08" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" fill="#172b25">else [có lỗi hoặc không đủ điều kiện tại bước tương ứng]</text><rect x="40" y="1053" width="1080" height="42" fill="#fff5df" stroke="#60756d"/><text x="580.0" y="1078.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">Điều kiện: trùng giờ / sai quyền / thiếu ảnh / quá hạn → trả lỗi, không chuyển approved.</text><rect x="40" y="1100" width="1080" height="42" fill="#fff5df" stroke="#60756d"/><text x="580.0" y="1125.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">Điều kiện: lỗi ghi storage → UI cảnh báo chưa lưu; retrySave, không cam kết đã bền vững.</text></svg>