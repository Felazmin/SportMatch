<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1058" viewBox="0 0 1160 1058"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527367"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M100.0,167 L100.0,904" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M420.0,167 L420.0,904" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M740.0,167 L740.0,904" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M1060.0,167 L1060.0,904" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M100.0,235 L420.0,235" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M420.0,292 L740.0,292" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,349 L805.0,349 L805.0,361 L740.0,361" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,406 L1060.0,406" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M100.0,463 L420.0,463" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M420.0,520 L740.0,520" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,577 L420.0,577" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M100.0,634 L420.0,634" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M420.0,691 L740.0,691" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,748 L805.0,748 L805.0,760 L740.0,760" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,805 L1060.0,805" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,862 L420.0,862" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M20,904 L1140,904" fill="none" stroke="#527367" stroke-width="1.5"/><text x="39" y="33.0" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#172b25">Phân quyền và thao tác nhân viên</text><text x="39" y="79.0" font-family="Arial" font-size="14" font-weight="normal" text-anchor="start" fill="#172b25">Hiện trạng: gọi nội bộ Flutter, không có API server. Mũi tên đứt: trả kết quả hoặc lỗi.</text><rect x="15.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="100.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">Chủ sân / NV</text><rect x="335.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="420.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">UI nhân viên</text><rect x="655.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="740.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">DemoSession</text><rect x="975.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="1060.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">SessionStore</text><rect x="20" y="175" width="1120" height="863" fill="none" stroke="#60756d"/><text x="31" y="194.0" font-family="Arial" font-size="12" font-weight="normal" text-anchor="start" fill="#172b25">alt [kiểm tra hợp lệ]</text><rect x="110.0" y="195" width="300.0" height="38" fill="white"/><text x="260.0" y="218.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">1. Chọn quyền/cơ sở và mật khẩu xác nhận</text><rect x="430.0" y="252" width="300.0" height="38" fill="white"/><text x="580.0" y="266.84000000000003" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">2. configureEmployeeAccess</text><text x="580.0" y="284.00000000000006" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">(expectedRevision)</text><rect x="667.5" y="309" width="210" height="38" fill="white"/><text x="772.5" y="323.84" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">3. Kiểm tra managerPassword,</text><text x="772.5" y="341.0" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">schedule phụ thuộc, scope</text><rect x="750.0" y="366" width="300.0" height="38" fill="white"/><text x="900.0" y="389.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">4. Lưu access và revision mới</text><rect x="110.0" y="423" width="300.0" height="38" fill="white"/><text x="260.0" y="446.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">5. Nhân viên đăng nhập trực tiếp</text><rect x="430.0" y="480" width="300.0" height="38" fill="white"/><text x="580.0" y="503.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">6. loginEmployee; employeeSchedule</text><rect x="430.0" y="537" width="300.0" height="38" fill="white"/><text x="580.0" y="560.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">7. Lịch/ca đúng phạm vi hoặc lỗi đăng nhập</text><rect x="110.0" y="594" width="300.0" height="38" fill="white"/><text x="260.0" y="617.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">8. Chọn điểm danh hoặc thu tại sân</text><rect x="430.0" y="651" width="300.0" height="38" fill="white"/><text x="580.0" y="665.84" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">9. employeeSetAttendance /</text><text x="580.0" y="683.0" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">employeeConfirmPayment</text><rect x="667.5" y="708" width="210" height="38" fill="white"/><text x="772.5" y="722.84" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">10. Kiểm tra quyền hiện hành,</text><text x="772.5" y="740.0" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">cơ sở, thời gian, trạng thái</text><rect x="750.0" y="765" width="300.0" height="38" fill="white"/><text x="900.0" y="788.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">11. Lưu kết quả và nhật ký</text><rect x="430.0" y="822" width="300.0" height="38" fill="white"/><text x="580.0" y="845.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">12. Thành công hoặc lỗi thiếu quyền</text><text x="570.0" y="924.08" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" fill="#172b25">else [có lỗi hoặc không đủ điều kiện tại bước tương ứng]</text><rect x="40" y="939" width="1080" height="42" fill="#fff5df" stroke="#60756d"/><text x="580.0" y="964.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">Điều kiện: quyền đã thu hồi / NV ngừng / ngoài cơ sở → chặn cả khi còn phiên cũ.</text><rect x="40" y="986" width="1080" height="42" fill="#fff5df" stroke="#60756d"/><text x="580.0" y="1011.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">onsite chỉ thu lịch đặt sân; nhân viên không duyệt hoàn tiền hay cấp quyền.</text></svg>