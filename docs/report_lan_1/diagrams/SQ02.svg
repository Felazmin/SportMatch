<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="887" viewBox="0 0 1160 887"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527367"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M100.0,167 L100.0,733" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M420.0,167 L420.0,733" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M740.0,167 L740.0,733" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M1060.0,167 L1060.0,733" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M100.0,235 L420.0,235" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M420.0,292 L740.0,292" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,349 L420.0,349" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M420.0,406 L740.0,406" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,463 L420.0,463" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M420.0,520 L100.0,520" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M100.0,577 L420.0,577" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M420.0,634 L740.0,634" fill="none" stroke="#527367" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M740.0,691 L420.0,691" fill="none" stroke="#527367" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M20,733 L1140,733" fill="none" stroke="#527367" stroke-width="1.5"/><text x="39" y="33.0" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#172b25">Hết hạn checkout</text><text x="39" y="79.0" font-family="Arial" font-size="14" font-weight="normal" text-anchor="start" fill="#172b25">Hiện trạng: gọi nội bộ Flutter, không có API server. Mũi tên đứt: trả kết quả hoặc lỗi.</text><rect x="15.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="100.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">Khách hàng</text><rect x="335.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="420.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">UI thanh toán</text><rect x="655.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="740.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">DemoSession</text><rect x="975.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="1060.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">SessionStore</text><rect x="20" y="175" width="1120" height="692" fill="none" stroke="#60756d"/><text x="31" y="194.0" font-family="Arial" font-size="12" font-weight="normal" text-anchor="start" fill="#172b25">alt [kiểm tra hợp lệ]</text><rect x="110.0" y="195" width="300.0" height="38" fill="white"/><text x="260.0" y="218.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">1. Mở thanh toán</text><rect x="430.0" y="252" width="300.0" height="38" fill="white"/><text x="580.0" y="275.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">2. Đọc deadline và expired(now)</text><rect x="430.0" y="309" width="300.0" height="38" fill="white"/><text x="580.0" y="332.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">3. Chờ chứng từ, bộ đếm theo deadline</text><rect x="430.0" y="366" width="300.0" height="38" fill="white"/><text x="580.0" y="389.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">4. Khi hết hạn: đọc lại trạng thái thực tế</text><rect x="430.0" y="423" width="300.0" height="38" fill="white"/><text x="580.0" y="446.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">5. expired chỉ cho awaitingProof / rejected</text><rect x="110.0" y="480" width="300.0" height="38" fill="white"/><text x="260.0" y="503.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">6. Popup hết hạn và hướng điều hướng</text><rect x="110.0" y="537" width="300.0" height="38" fill="white"/><text x="260.0" y="560.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">7. Thử gửi chứng từ sau hạn</text><rect x="430.0" y="594" width="300.0" height="38" fill="white"/><text x="580.0" y="617.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">8. submitProof kiểm tra lại thời gian</text><rect x="430.0" y="651" width="300.0" height="38" fill="white"/><text x="580.0" y="665.84" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">9. Từ chối gửi; không tự ghi nhận đã thanh</text><text x="580.0" y="683.0" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">toán</text><text x="570.0" y="753.08" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" fill="#172b25">else [có lỗi hoặc không đủ điều kiện tại bước tương ứng]</text><rect x="40" y="768" width="1080" height="42" fill="#fff5df" stroke="#60756d"/><text x="580.0" y="793.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">Điều kiện: đã pending hoặc approved → không áp dụng nhánh hết hạn chờ ảnh.</text><rect x="40" y="815" width="1080" height="42" fill="#fff5df" stroke="#60756d"/><text x="580.0" y="840.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">Store không có tác vụ tự hoàn tiền; UI popup không phải webhook ngân hàng.</text></svg>