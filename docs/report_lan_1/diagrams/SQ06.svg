7" fill="none" stroke="#527367" stroke-width="1.5"/><text x="39" y="33.0" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#172b25">Đăng ký và thanh toán giải đấu</text><text x="39" y="79.0" font-family="Arial" font-size="14" font-weight="normal" text-anchor="start" fill="#172b25">Hiện trạng: gọi nội bộ Flutter, không có API server. Mũi tên đứt: trả kết quả hoặc lỗi.</text><rect x="15.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="100.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">Khách hàng</text><rect x="335.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="420.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">UI giải đấu</text><rect x="655.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="740.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">DemoSession</text><rect x="975.0" y="115" width="170" height="52" fill="#ffffff" stroke="#60756d"/><text x="1060.0" y="145.76" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" fill="#172b25">SessionStore</text><rect x="20" y="175" width="1120" height="806" fill="none" stroke="#60756d"/><text x="31" y="194.0" font-family="Arial" font-size="12" font-weight="normal" text-anchor="start" fill="#172b25">alt [kiểm tra hợp lệ]</text><rect x="110.0" y="195" width="300.0" height="38" fill="white"/><text x="260.0" y="218.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">1. Xem giải, nhập người đăng ký và đồng đội</text><rect x="430.0" y="252" width="300.0" height="38" fill="white"/><text x="580.0" y="275.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">2. joinEvent: thời gian, capacity, nhóm, vé</text><rect x="430.0" y="309" width="300.0" height="38" fill="white"/><text x="580.0" y="332.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">3. Vé với eventSnapshot hoặc lỗi</text><rect x="110.0" y="366" width="300.0" height="38" fill="white"/><text x="260.0" y="389.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">4. Chọn phương thức và bấm thanh toán</text><rect x="430.0" y="423" width="300.0" height="38" fill="white"/><text x="580.0" y="446.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">5. payTournamentDemo(ticket, method)</text><rect x="667.5" y="480" width="210" height="38" fill="white"/><text x="772.5" y="494.84" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">6. Ghi approved;</text><text x="772.5" y="512.0" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">simulatedGateway=true</text><rect x="750.0" y="537" width="300.0" height="38" fill="white"/><text x="900.0" y="560.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">7. Lưu vé, thanh toán và trạng thái</text><rect x="430.0" y="594" width="300.0" height="38" fill="white"/><text x="580.0" y="617.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">8. Mã đăng ký, xác nhận suất</text><rect x="110.0" y="651" width="300.0" height="38" fill="white"/><text x="260.0" y="674.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">9. Xem vé và lịch đấu</text><rect x="430.0" y="708" width="300.0" height="38" fill="white"/><text x="580.0" y="731.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">10. Đọc vé/fixtures theo tài khoản</text><rect x="430.0" y="765" width="300.0" height="38" fill="white"/><text x="580.0" y="788.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">11. Trả thông tin thuộc phạm vi</text><text x="570.0" y="867.08" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" fill="#172b25">else [có lỗi hoặc không đủ điều kiện tại bước tương ứng]</text><rect x="40" y="882" width="1080" height="42" fill="#fff5df" stroke="#60756d"/><text x="580.0" y="907.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">Đây là thanh toán mô phỏng, không có PSP, webhook hoặc email thật.</text><rect x="40" y="929" width="1080" height="42" fill="#fff5df" stroke="#60756d"/><text x="580.0" y="954.42" font-family="Arial" font-size="13" font-weight="normal" text-anchor="middle" fill="#172b25">Điều kiện: hết chỗ / ngưng / hết hạn / vé không hợp lệ → không báo thành công.</text></svg>